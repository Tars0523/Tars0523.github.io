---
layout: research-home
---
<article class="detail">
<a class="back-link" href="{{ '/about/' | relative_url }}">← About</a>
<header class="detail-header"><p class="eyebrow">RESEARCH DIRECTION / {{ page.number }}</p><h1>{{ page.title }}</h1><p class="lead">{{ page.description }}</p></header>
<img class="detail-cover" src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}" width="1200" height="750">
<p class="caption">{{ page.caption }}</p>
<div class="prose">{{ content }}</div>
<nav class="detail-next" aria-label="Research navigation"><a href="{{ '/about/' | relative_url }}">← About</a><a href="{{ page.next_url | relative_url }}">{{ page.next_title }} ↗</a></nav>
</article>
